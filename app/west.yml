manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: tibiboard
      url-base: https://github.com/tibiboard
  projects:
    - name: zephyr
      remote: zmkfirmware
      revision: v4.1.0+zmk-fixes
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
    - name: hal_stm32
      revision: 4fcc3a3f32abe1c4cb76d9d1cef967728dd03908
      path: modules/hal/stm32
      remote: zmkfirmware
      groups:
        - hal
    - name: lvgl
      revision: f1db87ee98f1810328a8419572fa42a3b5f352ae
      path: modules/lib/gui/lvgl
      remote: zmkfirmware
    # studio-extras: protocol with the extra subsystems (combos / tap-dances / macros / status /
    # timing). Branch studio-extras of tibiboard/zmk-studio-messages.
    - name: zmk-studio-messages
      revision: ac812379d6dae80b109bb629de8e26329bbbe019
      path: modules/msgs/zmk-studio-messages
      remote: tibiboard
  group-filter: [+optional]
  self:
    west-commands: scripts/west-commands.yml
